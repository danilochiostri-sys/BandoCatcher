name: BandoCatcher — sync opportunità

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bandocatcher-sync.yml'
      - 'ingestion/connectors/inpa.py'
      - 'ingestion/connectors/ted.py'
      - 'ingestion/connectors/funding_tenders.py'
      - 'ingestion/sync.py'
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-bandocatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync TED + Funding & Tenders + inPA
        run: python ingestion/sync.py
      - name: Commit dataset
        run: |
          git config user.name "BandoCatcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunities.js data/sync-status.json
          git diff --cached --quiet && exit 0
          git commit -m "BandoCatcher: aggiorna opportunità"
          git push

name: BandoCatcher — sync opportunità

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bandocatcher-sync.yml'
      - 'ingestion/connectors/inpa.py'
      - 'ingestion/connectors/ted.py'
      - 'ingestion/connectors/funding_tenders.py'
      - 'ingestion/sync.py'
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita che due sincronizzazioni aggiornino main contemporaneamente.
concurrency:
  group: bandocatcher-sync-main
  cancel-in-progress: false

jobs:
  sync-bandocatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync TED + Funding & Tenders + inPA
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m ingestion.sync
      - name: Commit dataset
        run: |
          git config user.name "BandoCatcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunities.js data/sync-status.json
          git diff --cached --quiet && exit 0
          git commit -m "BandoCatcher: aggiorna opportunità"
          # Integra eventuali commit arrivati dopo il checkout prima del push.
          git pull --rebase origin main
          git push
